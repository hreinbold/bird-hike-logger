<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bird Hike Logger</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }

  #topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; background: #1b2a1f; color: #f2f2f2;
    flex-wrap: wrap;
  }
  #topbar h1 { font-size: 16px; margin: 0; margin-right: 8px; }
  #topbar label { font-size: 13px; }
  #hike-select { padding: 4px 6px; }
  #confidence-slider { width: 100px; vertical-align: middle; }
  #confidence-value { font-variant-numeric: tabular-nums; }
  #summary-toggle {
    margin-left: auto; padding: 5px 12px; border-radius: 6px;
    background: #3a5233; color: #fff; border: 1px solid #547048;
    cursor: pointer; font-size: 13px;
  }
  #summary-toggle:hover { background: #46613d; }
  body.summary-mode #topbar h1, body.summary-mode #hike-label { display: none; }

  #main { display: flex; flex: 1; min-height: 0; }
  #map { flex: 1; }

  #sidebar {
    width: 280px; overflow-y: auto; background: #fafaf8;
    border-left: 1px solid #ddd; padding: 8px;
  }
  #sidebar h2 {
    font-size: 13px; color: #666; margin: 8px 4px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px;
  }
  #current-species-label {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-transform: none; font-size: 14px; color: #2c3a2c; font-weight: 600;
  }
  #sidebar-toggle { display: none; font-size: 11px; flex-shrink: 0; }
  .species-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; margin-bottom: 4px; border-radius: 6px;
    cursor: pointer; background: #fff; border: 1px solid #e5e5e5;
  }
  .species-row:hover { background: #f0f4ef; }
  .species-row.selected { background: #dcebd8; border-color: #7fae74; }
  .species-name-row { display: flex; align-items: center; }
  .species-swatch {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    display: inline-block; margin-right: 6px;
  }
  .species-name { font-size: 14px; }
  .species-sci { font-size: 11px; color: #888; font-style: italic; margin-left: 16px; }
  .species-count {
    font-size: 12px; background: #eee; border-radius: 10px;
    padding: 2px 8px; color: #444;
  }
  #empty-state { padding: 12px; font-size: 13px; color: #888; }

  /* --- Mobile: sidebar becomes a collapsible sheet anchored under the topbar --- */
  @media (max-width: 700px) {
    #topbar { gap: 8px 12px; padding: 8px 12px; }
    #topbar h1 { width: 100%; }
    #main { position: relative; }
    #map { position: absolute; inset: 0; }
    #sidebar {
      position: absolute; left: 0; right: 0; top: 0; z-index: 10;
      width: auto; max-height: none;
      border-left: none; border-bottom: 1px solid #ddd;
      border-radius: 0 0 14px 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
      overflow: visible;
    }
    #species-list {
      max-height: 0; overflow: hidden;
      transition: max-height 0.2s ease;
    }
    #sidebar:not(.collapsed) #species-list {
      max-height: 50vh; overflow-y: auto;
    }
    #sidebar-toggle { display: inline; }

    body.summary-mode #sidebar {
      background: rgba(250, 250, 248, 0.8);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    body.summary-mode .species-row {
      background: rgba(255, 255, 255, 0.65);
      border-color: rgba(0, 0, 0, 0.08);
    }
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>Bird Hike Logger</h1>
    <label id="hike-label">Hike:
      <select id="hike-select"></select>
    </label>
    <label>Min confidence:
      <input type="range" id="confidence-slider" min="0" max="1" step="0.01" value="0.1">
      <span id="confidence-value">0.10</span>
    </label>
    <button id="summary-toggle">📸 Summary</button>
  </div>
  <div id="main">
    <div id="map"></div>
    <div id="sidebar" class="collapsed">
      <h2><span id="current-species-label">Species detected</span><span id="sidebar-toggle">▼</span></h2>
      <div id="species-list"></div>
    </div>
  </div>
</div>

<script>
document.getElementById("sidebar").querySelector("h2").addEventListener("click", () => {
  const sidebar = document.getElementById("sidebar");
  const toggle = document.getElementById("sidebar-toggle");
  sidebar.classList.toggle("collapsed");
  toggle.textContent = sidebar.classList.contains("collapsed") ? "▼" : "▲";
});
</script>
<script>
// --- Basemap: plain OSM raster tiles, no API key needed. -----------------
// Swap this `style` object for whatever tile source pdx-bird-report uses,
// if you want visual consistency across the two projects.
const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    glyphs: "https://fonts.openmaptiles.org/{fontstack}/{range}.pbf",
    sources: {
      osm: {
        type: "raster",
        tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
        tileSize: 256,
        attribution: "&copy; OpenStreetMap contributors",
      },
    },
    layers: [{ id: "osm", type: "raster", source: "osm" }],
  },
  center: [-122.64, 45.52],
  zoom: 13,
});

let currentGeojson = null;   // full parsed geojson for the active hike
let selectedSpecies = null;  // null == show nothing until species list loads
let summaryMode = false;     // true == show all species at once, color-coded
let speciesColorMap = new Map();  // species -> color, stable per hike regardless of confidence filter

// Distinct, high-contrast palette. Assigned by overall detection-count rank
// (computed once per hike from ALL detections, unfiltered by confidence) so
// a species keeps the same color no matter where the confidence slider sits.
const SPECIES_PALETTE = [
  "#e6194b", "#3cb44b", "#4363d8", "#f58231", "#911eb4",
  "#f032e6", "#008080", "#9a6324", "#800000", "#000075",
  "#e6beff", "#808000",
];

const hikeSelect = document.getElementById("hike-select");
const confidenceSlider = document.getElementById("confidence-slider");
const confidenceValue = document.getElementById("confidence-value");
const speciesListEl = document.getElementById("species-list");
const summaryToggle = document.getElementById("summary-toggle");

async function loadManifest() {
  const res = await fetch("data/manifest.json");
  const hikes = await res.json();

  hikeSelect.innerHTML = "";
  for (const hike of hikes) {
    const opt = document.createElement("option");
    opt.value = hike.file;
    opt.textContent = `${hike.label} (${hike.date})`;
    hikeSelect.appendChild(opt);
  }

  if (hikes.length > 0) {
    await loadHike(hikes[0].file);
  }
}

async function loadHike(path) {
  const res = await fetch(path);
  currentGeojson = await res.json();
  selectedSpecies = null;

  const allDetections = currentGeojson.features.filter(f => f.properties.feature_type === "detection");
  const overallRanked = speciesCounts(allDetections);
  speciesColorMap = new Map();
  overallRanked.forEach((entry, i) => {
    speciesColorMap.set(entry.species, SPECIES_PALETTE[i % SPECIES_PALETTE.length]);
  });

  render();
}

function detectionFeatures() {
  const minConfidence = parseFloat(confidenceSlider.value);
  return currentGeojson.features.filter(
    f => f.properties.feature_type === "detection" &&
         f.properties.confidence >= minConfidence
  );
}

function routeFeature() {
  return currentGeojson.features.find(f => f.properties.feature_type === "route");
}

function speciesCounts(features) {
  const counts = new Map();
  for (const f of features) {
    const key = f.properties.species;
    if (!counts.has(key)) {
      counts.set(key, { species: key, sci: f.properties.scientific_name, count: 0 });
    }
    counts.get(key).count += 1;
  }
  return [...counts.values()].sort((a, b) => b.count - a.count);
}

function updateCurrentSpeciesLabel(sorted) {
  const label = document.getElementById("current-species-label");
  if (sorted.length === 0) {
    label.textContent = "No species at this confidence level";
    return;
  }
  if (summaryMode) {
    const total = sorted.reduce((sum, s) => sum + s.count, 0);
    label.textContent = `All species (${total})`;
    return;
  }
  const entry = sorted.find(s => s.species === selectedSpecies) || sorted[0];
  label.textContent = `${entry.species} (${entry.count})`;
}

function renderSpeciesList(sorted) {
  speciesListEl.innerHTML = "";

  if (sorted.length === 0) {
    speciesListEl.innerHTML = '<div id="empty-state">No detections at this confidence level.</div>';
    updateCurrentSpeciesLabel(sorted);
    return;
  }

  // Default to the top species whenever nothing is selected, or the
  // previous selection no longer has any detections at this threshold.
  if (!selectedSpecies || !sorted.some(s => s.species === selectedSpecies)) {
    selectedSpecies = sorted[0].species;
  }

  updateCurrentSpeciesLabel(sorted);

  for (const entry of sorted) {
    const row = document.createElement("div");
    const isActive = !summaryMode && entry.species === selectedSpecies;
    row.className = "species-row" + (isActive ? " selected" : "");
    const color = speciesColorMap.get(entry.species) || "#c1440e";
    row.innerHTML = `
      <div>
        <div class="species-name-row">
          <span class="species-swatch" style="background:${color}"></span>
          <span class="species-name">${entry.species}</span>
        </div>
        <div class="species-sci">${entry.sci}</div>
      </div>
      <div class="species-count">${entry.count}</div>
    `;
    row.addEventListener("click", () => {
      if (summaryMode) {
        summaryMode = false;
        document.body.classList.remove("summary-mode");
        summaryToggle.textContent = "📸 Summary";
      }
      selectedSpecies = entry.species;
      render();
    });
    speciesListEl.appendChild(row);
  }
}

const CLUSTER_DISTANCE_METERS = 15;

function haversineMeters(a, b) {
  const R = 6371000;
  const toRad = deg => (deg * Math.PI) / 180;
  const dLat = toRad(b[1] - a[1]);
  const dLon = toRad(b[0] - a[0]);
  const lat1 = toRad(a[1]);
  const lat2 = toRad(b[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// Greedy proximity clustering within one species' points. Points within
// CLUSTER_DISTANCE_METERS of a cluster's running centroid join that cluster;
// otherwise they start a new one. Good enough for decluttering repeated
// same-spot calls (e.g. a hawk calling for a few minutes from one tree) --
// not meant to be a precise clustering algorithm.
function clusterOneSpecies(features) {
  const clusters = [];
  for (const f of features) {
    const coord = f.geometry.coordinates;
    const target = clusters.find(c => haversineMeters(c.centroid, coord) <= CLUSTER_DISTANCE_METERS);
    if (target) {
      target.count += 1;
      target.sumLon += coord[0];
      target.sumLat += coord[1];
      target.centroid = [target.sumLon / target.count, target.sumLat / target.count];
    } else {
      clusters.push({
        centroid: coord.slice(),
        sumLon: coord[0],
        sumLat: coord[1],
        count: 1,
        species: f.properties.species,
        sci: f.properties.scientific_name,
      });
    }
  }
  return clusters;
}

function buildClusterFeatures(features) {
  const bySpecies = new Map();
  for (const f of features) {
    const key = f.properties.species;
    if (!bySpecies.has(key)) bySpecies.set(key, []);
    bySpecies.get(key).push(f);
  }

  const clusterFeatures = [];
  for (const [species, group] of bySpecies.entries()) {
    const color = speciesColorMap.get(species) || "#c1440e";
    for (const c of clusterOneSpecies(group)) {
      clusterFeatures.push({
        type: "Feature",
        geometry: { type: "Point", coordinates: c.centroid },
        properties: { species: c.species, scientific_name: c.sci, count: c.count, color },
      });
    }
  }
  return clusterFeatures;
}

function updateMapLayers() {
  const route = routeFeature();
  const withinConfidence = detectionFeatures();
  const markerFeatures = summaryMode
    ? withinConfidence
    : withinConfidence.filter(f => f.properties.species === selectedSpecies);
  const clusterFeatures = buildClusterFeatures(markerFeatures);

  const routeSource = map.getSource("route");
  if (routeSource) {
    routeSource.setData({ type: "FeatureCollection", features: route ? [route] : [] });
  } else if (route) {
    map.addSource("route", { type: "geojson", data: { type: "FeatureCollection", features: [route] } });
    map.addLayer({
      id: "route-line",
      type: "line",
      source: "route",
      paint: { "line-color": "#0a7cff", "line-width": 4, "line-opacity": 0.9 },
    });
  }

  const markerData = { type: "FeatureCollection", features: clusterFeatures };
  const markerSource = map.getSource("detections");
  if (markerSource) {
    markerSource.setData(markerData);
  } else {
    map.addSource("detections", { type: "geojson", data: markerData });
    map.addLayer({
      id: "detection-points",
      type: "circle",
      source: "detections",
      paint: {
        "circle-radius": ["interpolate", ["linear"], ["get", "count"], 1, 8, 5, 13, 20, 20],
        "circle-color": ["get", "color"],
        "circle-opacity": 0.85,
        "circle-stroke-width": 2,
        "circle-stroke-color": "#fff",
      },
    });
    map.addLayer({
      id: "detection-count-labels",
      type: "symbol",
      source: "detections",
      layout: {
        "text-field": ["case", ["==", ["get", "count"], 1], "", ["to-string", ["get", "count"]]],
        "text-font": ["Open Sans Regular"],
        "text-size": 12,
        "text-allow-overlap": true,
        "text-ignore-placement": true,
      },
      paint: {
        "text-color": "#ffffff",
        "text-halo-color": "rgba(0,0,0,0.45)",
        "text-halo-width": 1.2,
      },
    });
  }

  // Fit the view to the route on first load of a hike.
  if (route && !map._fitDoneForCurrentHike) {
    const coords = route.geometry.coordinates;
    const bounds = coords.reduce(
      (b, c) => b.extend(c),
      new maplibregl.LngLatBounds(coords[0], coords[0])
    );
    map.fitBounds(bounds, { padding: 40 });
    map._fitDoneForCurrentHike = true;
  }
}

function render() {
  if (!currentGeojson) return;
  const sorted = speciesCounts(detectionFeatures());
  renderSpeciesList(sorted);
  updateMapLayers();
}

hikeSelect.addEventListener("change", () => {
  map._fitDoneForCurrentHike = false;
  loadHike(hikeSelect.value);
});

confidenceSlider.addEventListener("input", () => {
  confidenceValue.textContent = parseFloat(confidenceSlider.value).toFixed(2);
  render();
});

summaryToggle.addEventListener("click", () => {
  summaryMode = !summaryMode;
  document.body.classList.toggle("summary-mode", summaryMode);
  summaryToggle.textContent = summaryMode ? "Exit summary" : "📸 Summary";
  if (summaryMode) {
    document.getElementById("sidebar").classList.remove("collapsed");
    document.getElementById("sidebar-toggle").textContent = "▲";
  }
  render();
});

map.on("load", loadManifest);
</script>
</body>
</html>
